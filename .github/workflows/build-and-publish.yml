name: "UDYAT — Cross-Platform Build & Publish"

# ─────────────────────────────────────────────────────────────────────────────
# Trigger: Webhook (repository_dispatch) or manual (workflow_dispatch)
# ─────────────────────────────────────────────────────────────────────────────
on:
  repository_dispatch:
    types: [release-dispatch, build-trigger]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / version to build (e.g. v1.0.1)"
        required: true

# ─────────────────────────────────────────────────────────────────────────────
# Shared environment (Zero sensitive endpoints — completely driven by Secrets)
# ─────────────────────────────────────────────────────────────────────────────
env:
  TAG_NAME: ${{ github.event.client_payload.tag || github.event.inputs.tag }}

permissions:
  contents: read
  actions: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1. Android (Split APKs & Universal) — Ubuntu
  # ───────────────────────────────────────────────────────────────────────────
  build-android:
    name: "🤖 Android (APKs)"
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        run: |
          git -c http.sslVerify=false clone --depth 1 --branch "${{ env.TAG_NAME }}" "${{ secrets.SOURCE_REPO_URL }}" source
        shell: bash

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Split APKs (armv8, armv7, x86_64) (Obfuscated)
        working-directory: source
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=symbols/android

      - name: Build Universal APK (Obfuscated)
        working-directory: source
        run: |
          flutter build apk --release --obfuscate --split-debug-info=symbols/android

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp source/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "artifacts/udyat-armv8.apk"
          cp source/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "artifacts/udyat-armv7.apk"
          cp source/build/app/outputs/flutter-apk/app-release.apk             "artifacts/udyat-universal.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Windows (x64 ZIP) — Windows
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: "🪟 Windows (x64)"
    runs-on: windows-latest
    steps:
      - name: Clone source
        run: |
          git -c http.sslVerify=false clone --depth 1 --branch "${{ env.TAG_NAME }}" "${{ secrets.SOURCE_REPO_URL }}" source
        shell: bash

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Windows (Obfuscated)
        working-directory: source
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=symbols/windows

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Compress-Archive -Path "source\build\windows\x64\runner\Release\*" `
            -DestinationPath "artifacts\udyat-windows.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Linux (x64 ZIP) — Ubuntu
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: "🐧 Linux (x64)"
    runs-on: ubuntu-latest
    steps:
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv zip

      - name: Clone source
        run: |
          git -c http.sslVerify=false clone --depth 1 --branch "${{ env.TAG_NAME }}" "${{ secrets.SOURCE_REPO_URL }}" source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build Linux (Obfuscated)
        working-directory: source
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release --obfuscate --split-debug-info=symbols/linux

      - name: Package ZIP
        run: |
          mkdir -p artifacts
          cd source/build/linux/x64/release/bundle
          zip -r -9 "$GITHUB_WORKSPACE/artifacts/udyat-linux.zip" *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 4. macOS (.app) — macOS
  # ───────────────────────────────────────────────────────────────────────────
  build-macos:
    name: "🍎 macOS"
    runs-on: macos-latest
    steps:
      - name: Clone source
        run: |
          git -c http.sslVerify=false clone --depth 1 --branch "${{ env.TAG_NAME }}" "${{ secrets.SOURCE_REPO_URL }}" source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build macOS (Obfuscated)
        working-directory: source
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release --obfuscate --split-debug-info=symbols/macos

      - name: Prepare macOS Application (udyat-macOS.app)
        run: |
          mkdir -p artifacts
          cd source/build/macos/Build/Products/Release
          APP_DIR="UDYAT.app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR="Runner.app"
          fi
          # Empaquetar la aplicación nativa directamente como udyat-macOS.app preservando symlinks
          zip -r -y -9 "$GITHUB_WORKSPACE/artifacts/udyat-macOS.app" "$APP_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 5. iOS (.ipa unsigned for sideloading) — macOS
  # ───────────────────────────────────────────────────────────────────────────
  build-ios:
    name: "📱 iOS (IPA)"
    runs-on: macos-latest
    steps:
      - name: Clone source
        run: |
          git -c http.sslVerify=false clone --depth 1 --branch "${{ env.TAG_NAME }}" "${{ secrets.SOURCE_REPO_URL }}" source

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Build iOS (No Codesign, Obfuscated)
        working-directory: source
        run: |
          flutter pub get
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=symbols/ios

      - name: Package IPA for Sideloading
        run: |
          mkdir -p artifacts
          cd source/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -9 "$GITHUB_WORKSPACE/artifacts/udyat-ios.ipa" Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: artifacts/*
          retention-days: 1
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # PUBLISH — Collect all artifacts, push Release to Gitea, and purge from GitHub
  # ═══════════════════════════════════════════════════════════════════════════
  publish-release:
    name: "🚀 Publish Release to Gitea"
    needs: [build-android, build-windows, build-linux, build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      # ── Download all platform artifacts ──
      - name: Download Android
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Download macOS
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: release-assets

      # ── Delete existing release with same tag (if any) ──
      - name: Clean old release (if exists)
        run: |
          TAG="${{ env.TAG_NAME }}"
          ENDPOINT="${{ secrets.RELEASE_ENDPOINT }}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"

          echo "🔍 Checking for existing release with tag: $TAG"

          # Get release by tag
          RELEASE_JSON=$(curl -k -s -w "\n%{http_code}" \
            -H "Authorization: token $TOKEN" \
            "$ENDPOINT/releases/tags/$TAG")

          HTTP_CODE=$(echo "$RELEASE_JSON" | tail -n1)
          BODY=$(echo "$RELEASE_JSON" | sed '$d')

          if [ "$HTTP_CODE" = "200" ]; then
            RELEASE_ID=$(echo "$BODY" | jq -r '.id')
            echo "🗑️ Deleting existing release ID: $RELEASE_ID"
            curl -k -s -X DELETE \
              -H "Authorization: token $TOKEN" \
              "$ENDPOINT/releases/$RELEASE_ID"
            echo "✅ Old release deleted"
          else
            echo "ℹ️ No existing release found for tag $TAG (HTTP $HTTP_CODE)"
          fi

          # Also delete tag if exists
          curl -k -s -X DELETE \
            -H "Authorization: token $TOKEN" \
            "$ENDPOINT/tags/$TAG" || true

          echo "✅ Tag cleanup done"
        shell: bash

      # ── Create new Release on Gitea ──
      - name: Create Release
        id: create_release
        run: |
          TAG="${{ env.TAG_NAME }}"
          ENDPOINT="${{ secrets.RELEASE_ENDPOINT }}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"

          BODY="## UDYAT — Streaming Multimedia ($TAG)\n\n### 📦 Descargas Oficiales:\n- 📱 **Android ARMv8 (64-bit)**: \`udyat-armv8.apk\` (Móviles y tablets modernos).\n- 📺 **Android ARMv7 (32-bit)**: \`udyat-armv7.apk\` (Fire TV Stick Lite / 3rd Gen, Android TV 32-bit).\n- 🌐 **Android Universal**: \`udyat-universal.apk\` (Compatible con cualquier dispositivo Android).\n- 🍎 **iOS Package**: \`udyat-ios.ipa\` (Sideloading con AltStore, Sideloadly, TrollStore, Scarlet).\n- 🪟 **Windows (x64)**: \`udyat-windows.zip\` (Portable para Windows 10 y Windows 11).\n- 🍏 **macOS**: \`udyat-macOS.app\` (Aplicación nativa UDYAT.app).\n- 🐧 **Linux (x64)**: \`udyat-linux.zip\` (Binario nativo para Linux).\n\n---\n*Compilado y publicado automáticamente mediante UDYAT-COMPILER para tag \`$TAG\`.*"

          RESPONSE=$(curl -k -s -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"$TAG\", \"name\": \"UDYAT $TAG\", \"body\": \"$BODY\", \"draft\": false, \"prerelease\": false}" \
            "$ENDPOINT/releases")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "❌ Error creating release: $RESPONSE"
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "✅ Created release ID: $RELEASE_ID"
        shell: bash

      # ── Upload all assets to the Gitea Release ──
      - name: Upload assets to Release
        run: |
          ENDPOINT="${{ secrets.RELEASE_ENDPOINT }}"
          TOKEN="${{ secrets.RELEASE_TOKEN }}"
          RELEASE_ID="${{ steps.create_release.outputs.release_id }}"

          echo "📤 Uploading assets to release ID: $RELEASE_ID"

          for FILE in release-assets/*; do
            FILENAME=$(basename "$FILE")
            echo "  ⬆️ Uploading: $FILENAME"
            UPLOAD_RESP=$(curl -k -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$FILE" \
              "$ENDPOINT/releases/$RELEASE_ID/assets?name=$FILENAME")
            HTTP_CODE=$(echo "$UPLOAD_RESP" | tail -n1)
            if [ "$HTTP_CODE" = "201" ]; then
              echo "  ✅ $FILENAME uploaded successfully"
            else
              echo "  ⚠️ $FILENAME upload response ($HTTP_CODE): $(echo "$UPLOAD_RESP" | sed '$d')"
            fi
          done

          echo "🎉 All assets uploaded successfully to Gitea!"
        shell: bash

      # ── Purge all temporary build artifacts from GitHub immediately ──
      - name: Delete build artifacts from GitHub
        if: always()
        run: |
          echo "🧹 Purging temporary build artifacts from GitHub..."
          ARTIFACTS_JSON=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")

          echo "$ARTIFACTS_JSON" | jq -r '.artifacts[]?.id' | while read -r ID; do
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              echo "  🗑️ Purging GitHub artifact ID: $ID"
              curl -s -X DELETE \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "Accept: application/vnd.github+json" \
                "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/$ID"
            fi
          done
          echo "✨ GitHub is clean. All build artifacts deleted."
        shell: bash
